spring.application.name=finance-tracker

# Allow .env file, Auto detect as .properties if no file extension found
spring.config.import=optional:file:.env[.properties]

# MYSQL Settings
spring.datasource.url=jdbc:mysql://localhost:3306/finance_tracker
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}

# Do not use update for operations...
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true